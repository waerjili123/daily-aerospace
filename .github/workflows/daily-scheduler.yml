name: Daily Laser and Space Intelligence Scheduler

run-name: scheduled-live

on:
  schedule:
    - cron: "50 23 * * *"
    - cron: "20 0 * * *"

permissions:
  contents: read
  actions: read

jobs:
  daily:
    uses: ./.github/workflows/daily-intelligence.yml
    with:
      discovery_mode: daily
      max_queries: "20"
      delivery_mode: dingtalk_live
    secrets: inherit
