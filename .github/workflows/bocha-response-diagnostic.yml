name: Bocha Response Diagnostic

on:
  push:
    branches:
      - codex/bocha-response-diagnostic
    paths:
      - .github/workflows/bocha-response-diagnostic.yml
      - scripts/bocha_response_diagnostic.py

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Probe one neutral Bocha query
        env:
          BOCHA_API_KEY: ${{ secrets.BOCHA_API_KEY }}
        run: python scripts/bocha_response_diagnostic.py

      - name: Commit redacted response shape
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/bocha-response-shape.json
          git commit -m "diagnostics: record redacted Bocha response shape"
          git push origin HEAD:"${GITHUB_REF_NAME}"
