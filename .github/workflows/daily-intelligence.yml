name: Daily Laser and Space Intelligence

on:
  workflow_dispatch:
    inputs:
      max_queries:
        description: "Bocha query count for manual collection validation"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
        default: "4"

concurrency:
  group: laser-space-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and development dependencies
        env:
          PIP_CONSTRAINT: constraints.txt
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Guard one-time DingTalk branch
        run: test "${GITHUB_REF}" = "refs/heads/codex/dingtalk-test-20260727"

      - name: Run daily pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BOCHA_API_KEY: ${{ secrets.BOCHA_API_KEY }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: >-
          laser-space-daily
          --config config.yaml
          --max-queries "${{ inputs.max_queries }}"

      - name: Upload generated report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-intelligence-report
          path: |
            reports/
            data/
          if-no-files-found: warn
