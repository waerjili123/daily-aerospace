name: Daily Laser and Space Intelligence

on:
  workflow_dispatch:
    inputs:
      discovery_mode:
        description: "Daily incremental or one-time 90-day backfill"
        type: choice
        options:
          - "daily"
          - "backfill"
        default: "daily"
      max_queries:
        description: "Bocha hard query budget (daily <=12, backfill <=40)"
        type: choice
        options:
          - "4"
          - "12"
          - "40"
        default: "12"
      delivery_mode:
        description: "Generate only, or send one test-labeled DingTalk report"
        type: choice
        options:
          - "dry_run"
          - "dingtalk_test"
        default: "dry_run"

concurrency:
  group: laser-space-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and development dependencies
        env:
          PIP_CONSTRAINT: constraints.txt
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Guard verification branch
        run: test "${GITHUB_REF}" = "refs/heads/codex/verification-promotion-20260728"

      - name: Run daily pipeline
        id: daily_pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BOCHA_API_KEY: ${{ secrets.BOCHA_API_KEY }}
          DINGTALK_WEBHOOK: ${{ inputs.delivery_mode == 'dingtalk_test' && secrets.DINGTALK_WEBHOOK || 'https://example.invalid/manual-dry-run' }}
          DINGTALK_SECRET: ${{ inputs.delivery_mode == 'dingtalk_test' && secrets.DINGTALK_SECRET || 'unused-manual-dry-run-secret' }}
          DELIVERY_MODE: ${{ inputs.delivery_mode }}
        shell: bash
        run: |
          args=(
            --config config.yaml
            --discovery-mode "${{ inputs.discovery_mode }}"
            --max-queries "${{ inputs.max_queries }}"
          )
          if [[ "${DELIVERY_MODE}" == "dry_run" ]]; then
            args+=(--dry-run)
          else
            args+=(--test-label)
          fi
          laser-space-daily "${args[@]}"

      - name: Publish report summary
        if: success()
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          workspace = Path.cwd().resolve()
          manifest_path = workspace / "data/run-result.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("status") != "success":
              raise SystemExit("run-result.json does not describe a successful run")

          report_reference = manifest.get("report_path")
          if not isinstance(report_reference, str) or not report_reference:
              raise SystemExit("run-result.json has no report_path")

          reports_root = (workspace / "reports").resolve()
          report_path = (workspace / report_reference).resolve()
          if (
              not report_path.is_relative_to(reports_root)
              or report_path.suffix.lower() != ".md"
              or not report_path.is_file()
          ):
              raise SystemExit("run-result.json points to an invalid report")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(report_path.read_text(encoding="utf-8"))

      - name: Publish failure diagnostics summary
        if: failure()
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          diagnostic_path = Path("data/failure-diagnostics.json")

          def inline(value):
              if not isinstance(value, str) or not value:
                  return "unknown"
              return value.replace("`", "'").replace("\r", " ").replace("\n", " ")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Pipeline failure diagnostics\n\n")
              if not diagnostic_path.is_file():
                  summary.write(
                      "Structured diagnostics were not generated; "
                      "inspect the failed step log.\n"
                  )
              else:
                  try:
                      diagnostic = json.loads(
                          diagnostic_path.read_text(encoding="utf-8")
                      )
                  except (OSError, UnicodeError, json.JSONDecodeError):
                      summary.write(
                          "Structured diagnostics are unreadable; "
                          "inspect the failed step log.\n"
                      )
                  else:
                      summary.write(f"- Stage: `{inline(diagnostic.get('stage'))}`\n")
                      summary.write(
                          f"- Error type: `{inline(diagnostic.get('error_type'))}`\n"
                      )
                      frames = diagnostic.get("frames")
                      if isinstance(frames, list) and frames:
                          summary.write("- Repository traceback frames:\n")
                          for frame in frames:
                              if not isinstance(frame, dict):
                                  continue
                              path = inline(frame.get("path"))
                              function = inline(frame.get("function"))
                              line = frame.get("line")
                              if not isinstance(line, int):
                                  line = "unknown"
                              summary.write(
                                  f"  - `{path}:{line} ({function})`\n"
                              )

      - name: Upload generated report
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-intelligence-report
          path: |
            reports/
            data/
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-intelligence-failure-diagnostics
          path: |
            reports/
            data/
          if-no-files-found: warn
