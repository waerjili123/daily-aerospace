name: One-time Collection Validation

on:
  push:
    branches:
      - codex/collection-validation-run

concurrency:
  group: laser-space-collection-validation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and development dependencies
        env:
          PIP_CONSTRAINT: constraints.txt
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Run collection validation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BOCHA_API_KEY: ${{ secrets.BOCHA_API_KEY }}
          DINGTALK_WEBHOOK: https://example.invalid/manual-dry-run
          DINGTALK_SECRET: unused-manual-dry-run-secret
        run: >-
          laser-space-daily
          --config config.yaml
          --dry-run
          --max-queries 4

      - name: Print collection evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "=== reports ==="
          find reports -maxdepth 2 -type f -print -exec sed -n '1,240p' {} \; 2>/dev/null || true
          echo "=== data ==="
          find data -maxdepth 2 -type f -print -exec sed -n '1,160p' {} \; 2>/dev/null || true

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: collection-validation-report
          path: |
            reports/
            data/
          if-no-files-found: warn
